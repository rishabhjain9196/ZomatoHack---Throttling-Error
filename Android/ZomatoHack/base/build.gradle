apply plugin: 'com.android.feature'

android {
    compileSdkVersion 26
    baseFeature true
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 26
        versionCode 1
        versionName "1.0"
        def mapsApiKey = System.getenv("GOOGLE_MAPS_API_KEY")
        if (!mapsApiKey) {
            throw new GradleException("Set GOOGLE_MAPS_API_KEY before building the archived Android client.")
        }
        resValue "string", "google_maps_key", mapsApiKey
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api 'com.android.support:appcompat-v7:26.1.0'
    api 'com.google.android.gms:play-services-maps:16.0.0'
    application project(':app')
    feature project(':main')
}
