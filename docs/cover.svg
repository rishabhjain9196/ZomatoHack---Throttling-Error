<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Demand-Supply Workforce Heatmaps in 2019</title>
<desc id="desc">Team Throttling-Error placed third nationally. The diagram shows ten archived Bengaluru zone coordinates, sized by synthetic demand per resource unit on Monday at 18:30.</desc>
<rect width="1200" height="630" fill="#17343b"/><rect x="630" y="65" width="525" height="490" rx="22" fill="#e8ede7"/>
<g font-family="Arial,sans-serif"><text x="55" y="90" font-size="15" letter-spacing="2" fill="#f6b498">ZOMATO HACKANOODLE / 2019</text>
<text x="55" y="170" font-size="54" fill="white">Where should</text><text x="55" y="232" font-size="54" fill="white">the workforce</text><text x="55" y="294" font-size="54" fill="white">move?</text>
<text x="55" y="365" font-size="20" fill="#d5e3df">Our team placed third nationally</text><text x="55" y="396" font-size="20" fill="#d5e3df">and presented to Deepinder Goyal.</text>
<text x="55" y="476" font-size="30" fill="#f6b498">10 zones / 3 scenarios / 28 days</text>
<text x="55" y="514" font-size="16" fill="#d5e3df">This is synthetic data, not a live fleet.</text>
<text x="660" y="105" font-size="17" fill="#17343b">Bengaluru zone coordinates</text>
<circle cx="875.3" cy="331.5" r="17.9" fill="#e28d67" fill-opacity=".8"/><text x="875.3" y="336.5" text-anchor="middle" fill="#17343b" font-size="14">1</text><circle cx="896.8" cy="260.1" r="17.7" fill="#e28d67" fill-opacity=".8"/><text x="896.8" y="265.1" text-anchor="middle" fill="#17343b" font-size="14">2</text><circle cx="824.7" cy="336.2" r="19.2" fill="#e28d67" fill-opacity=".8"/><text x="824.7" y="341.2" text-anchor="middle" fill="#17343b" font-size="14">3</text><circle cx="812.3" cy="359.7" r="25.1" fill="#e28d67" fill-opacity=".8"/><text x="812.3" y="364.7" text-anchor="middle" fill="#17343b" font-size="14">4</text><circle cx="906.5" cy="363.6" r="24.8" fill="#e28d67" fill-opacity=".8"/><text x="906.5" y="368.6" text-anchor="middle" fill="#17343b" font-size="14">5</text><circle cx="1062.1" cy="263.5" r="25.3" fill="#e28d67" fill-opacity=".8"/><text x="1062.1" y="268.5" text-anchor="middle" fill="#17343b" font-size="14">6</text><circle cx="849.5" cy="349.8" r="25.6" fill="#e28d67" fill-opacity=".8"/><text x="849.5" y="354.8" text-anchor="middle" fill="#17343b" font-size="14">7</text><circle cx="951.2" cy="474.2" r="24.3" fill="#e28d67" fill-opacity=".8"/><text x="951.2" y="479.2" text-anchor="middle" fill="#17343b" font-size="14">8</text><circle cx="744.2" cy="169.0" r="24.7" fill="#e28d67" fill-opacity=".8"/><text x="744.2" y="174.0" text-anchor="middle" fill="#17343b" font-size="14">9</text><circle cx="727.5" cy="260.1" r="26.0" fill="#e28d67" fill-opacity=".8"/><text x="727.5" y="265.1" text-anchor="middle" fill="#17343b" font-size="14">10</text>
<text x="660" y="530" font-size="14" fill="#17343b">Circle size shows demand per resource unit at 18:30.</text>
<text x="55" y="595" font-size="14" fill="#d5e3df">Team 7: Abhirup Mondal, Pooja Agarwal, Rishabh Jain and Sanket Jain.</text></g></svg>
